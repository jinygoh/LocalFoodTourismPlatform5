{% with id=widget.attrs.id %}<div class="flex items-center space-x-4">
    <label for="{{ id }}" class="cursor-pointer bg-secondary text-white font-bold py-2 px-4 rounded-lg hover:bg-opacity-90 transition-opacity">
        Choose File
    </label>
    <input type="{{ widget.type }}" name="{{ widget.name }}" {% include "django/forms/widgets/attrs.html" %} class="hidden">
    {% if widget.value and widget.value.url %}
        <span class="text-text-dark-muted">Current: <a href="{{ widget.value.url }}" target="_blank" class="text-primary hover:underline">View</a></span>
        {% if not widget.required %}
            <div class="flex items-center">
                <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="form-checkbox h-5 w-5 text-primary rounded-sm bg-background-dark border-border-dark focus:ring-primary/50">
                <label for="{{ widget.checkbox_id }}" class="ml-2 text-sm text-text-dark-muted">{{ widget.clear_checkbox_label }}</label>
            </div>
        {% endif %}
    {% endif %}
</div>{% endwith %}
